server:
  host: "127.0.0.1"
  port: 18456

# 过渡保留（M13.5 起主进程调度不再消费本段；渲染端设置页仍读写，M13.6 迁移后删除）：
providers:
  deepseek:
    balance_url: "https://api.deepseek.com/user/balance"
    check_interval_min: 1
    balance_warn_threshold: 10            # ¥ 绝对金额（v2.3：原比例 0.15 改绝对值，API 不返回总预算）

# M13.1 用量视图泛化：余量源列表（可插拔，多 provider 惰性出卡）。
#   kind: http-json    = 通用 GET + JSON 提取（配置驱动，零代码适配 90% 厂商）
#   kind: bss          = 阿里云 BSS QueryAccountBalance（HMAC-SHA1 签名，按量）
#   kind: subscription = 厂商订阅套餐专属余量查询
# billing: payg=按量消费（余量=剩余金额）；subscription=订阅消费（余量=剩余套餐额度）
# remaining: path=剩余值本体（JSON 点号路径，支持数组下标如 balance_infos[0].total_balance）；
#            若 API 返回 limit+usage 而非剩余，填 limit 自动算 limit-usage
# auth: type=bearer 时 key_env 存 API key 的环境变量名；type=none 免鉴权
# warn_threshold: 低余量告警线（可选，命中即告警）
usage_sources:
  - id: deepseek
    name: DeepSeek
    billing: payg
    kind: http-json
    url: "https://api.deepseek.com/user/balance"
    auth:
      type: bearer
      key_env: "DEEPSEEK_API_KEY"
    remaining:
      path: "balance_infos[0].total_balance"
    unit: CNY
    currency: CNY
    warn_threshold: 10
    # M15：detect_ids 已删——cc-switch 检测结果按 url host 归并，本源 url host
    # (api.deepseek.com) 自动匹配，无需手配桥接（见 services.buildUsageCards）
  - id: aliyun-bailian
    name: 阿里云百炼
    billing: subscription
    kind: subscription
    url: ""                        # 端点待用户提供，先占位
    auth:
      type: none
    remaining:
      path: ""
    unit: token
    # M15：detect_ids 改 host——cc-switch 按 host 归并后，百炼两个 provider（coding/AIgC）
    # 共享 base_url host，合并成一张卡；本源 url 空，靠 detect_ids 桥接
    detect_ids:
      - "token-plan.cn-beijing.maas.aliyuncs.com"

# 检测器注册表：cc_switch 可选（本机未装自动跳过，db_path 支持 ~ 展开）；
# claude_sessions 扫会话记录；manual 恒生效（无配置项）
detection:
  cc_switch:
    enabled: true
    db_path: "~/.cc-switch/cc-switch.db"
  claude_sessions:
    enabled: true

# M13.5：全局用量源轮询间隔（分钟，多卡余量轮询；替代过渡的 providers.deepseek.check_interval_min）
usage_poll_interval_min: 1

harnesses:
  claude-code:
    sessions_glob: "~/.claude/sessions/*.json"
    settings_path: "~/.claude/settings.json"
    refresh_interval_sec: 3
    config_dirs:                      # Claude config 目录（v2.3 仅扫此列表，无自动发现）
      - "~/.claude"

notifications:
  enabled: true
  approve_timeout_sec: 60

window:                               # 尺寸以设计资料为准，见 DESIGN §2.9
  width: 420
  height: 650
