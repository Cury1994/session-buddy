server:
  host: "127.0.0.1"
  port: 18456

providers:
  deepseek:
    balance_url: "https://api.deepseek.com/user/balance"
    check_interval_min: 1
    balance_warn_threshold: 10            # ¥ 绝对金额（v2.3：原比例 0.15 改绝对值，API 不返回总预算）

# M13 用量视图泛化：余额源列表（多 provider 惰性出卡）。
#   type: api  = GET balance_url + Authorization: Bearer $api_key_env（DeepSeek 式）
#   type: bss  = 阿里云 BSS QueryAccountBalance（business.aliyuncs.com v2017-12-14，HMAC-SHA1 签名）
# 低余额告警线沿用上方 providers.deepseek.balance_warn_threshold（全局）
usage_sources:
  - id: deepseek
    name: DeepSeek
    type: api
    balance_url: "https://api.deepseek.com/user/balance"
    api_key_env: "DEEPSEEK_API_KEY"
  - id: aliyun-bailian
    name: 阿里云百炼
    type: bss
    access_key_id_env: "ALIYUN_ACCESS_KEY_ID"
    access_key_secret_env: "ALIYUN_ACCESS_KEY_SECRET"

# 消耗卡（5h/7d 实际消耗）数据源：cc-switch 本地库 proxy_request_logs（只读聚合）
cc_switch:
  db_path: "~/.cc-switch/cc-switch.db"

harnesses:
  claude-code:
    sessions_glob: "~/.claude/sessions/*.json"
    settings_path: "~/.claude/settings.json"
    refresh_interval_sec: 3
    config_dirs:                      # Claude config 目录（v2.3 仅扫此列表，无自动发现）
      - "~/.claude"

notifications:
  enabled: true
  approve_timeout_sec: 60

window:                               # 尺寸以设计资料为准，见 DESIGN §2.9
  width: 340
  height: 650
